<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Claw Operator Console</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --rail: #0d1017;
        --panel: #11151e;
        --panel-2: #171c27;
        --panel-3: #1d2330;
        --line: #252c3a;
        --line-bright: #343d4f;
        --text: #f2f5fa;
        --muted: #8993a5;
        --faint: #5e6879;
        --brand: #ff7657;
        --brand-2: #ffb45f;
        --cyan: #5ad6e8;
        --green: #4ad295;
        --yellow: #f4bf58;
        --red: #f06d78;
        --violet: #a78bfa;
        --shadow: 0 18px 50px rgba(0,0,0,.3);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background:
          radial-gradient(circle at 70% -20%, rgba(90,214,232,.08), transparent 35%),
          radial-gradient(circle at 12% 110%, rgba(255,118,87,.07), transparent 32%),
          var(--bg);
        color: var(--text);
        font: 14px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      button, input, textarea, select { font: inherit; }
      button { color: inherit; }
      .app { display: grid; grid-template-columns: 224px minmax(0,1fr); height: 100vh; }
      .rail {
        display: flex; flex-direction: column; min-height: 0; padding: 18px 12px;
        background: rgba(13,16,23,.96); border-right: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 21px; }
      .brandmark {
        width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
        background: linear-gradient(145deg,var(--brand),#e84e73); box-shadow: 0 8px 22px rgba(255,118,87,.22);
        color: white; font-weight: 900; font-size: 18px;
      }
      .brand strong { display: block; font-size: 14px; letter-spacing: -.15px; }
      .brand small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
      .nav-label { padding: 9px 10px 5px; color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .tab {
        width: 100%; border: 0; background: transparent; border-radius: 9px; padding: 9px 10px;
        display: flex; align-items: center; gap: 10px; color: var(--muted); cursor: pointer; text-align: left;
      }
      .tab:hover { background: rgba(255,255,255,.035); color: var(--text); }
      .tab[aria-selected="true"] { color: var(--text); background: var(--panel-3); box-shadow: inset 0 0 0 1px rgba(255,255,255,.035); }
      .tab .ico { width: 21px; color: var(--faint); font-family: ui-monospace, monospace; font-size: 12px; text-align: center; }
      .tab[aria-selected="true"] .ico { color: var(--brand); }
      .rail-foot { margin-top: auto; padding: 13px 10px 2px; border-top: 1px solid var(--line); }
      .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
      .dot.online, .dot.idle, .dot.done { background: var(--green); box-shadow: 0 0 0 3px rgba(74,210,149,.09); }
      .dot.working { background: var(--cyan); box-shadow: 0 0 0 3px rgba(90,214,232,.1); animation: pulse 1.25s ease-in-out infinite; }
      .dot.waiting, .dot.paused { background: var(--yellow); }
      .dot.error { background: var(--red); }
      @keyframes pulse { 50% { opacity: .38; transform: scale(.78); } }
      .shell { min-width: 0; min-height: 0; height: 100vh; overflow: hidden; display: grid; grid-template-rows: 64px auto minmax(0,1fr); }
      .header {
        display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--line);
        background: rgba(9,11,16,.72); backdrop-filter: blur(14px);
      }
      .header h1 { margin: 0; font-size: 17px; letter-spacing: -.35px; }
      .header .sub { color: var(--muted); font-size: 12px; }
      .header .grow { flex: 1; }
      .health-pill { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
      .usage-dock { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(13,16,23,.9); }
      .usage-label { display: flex; flex-direction: column; justify-content: center; gap: 3px; color: var(--muted); font-size: 10px; }
      .usage-label strong { color: var(--text); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
      .usage-label button { width: fit-content; padding: 2px 0; border: 0; background: transparent; color: var(--cyan); cursor: pointer; font-size: 10px; }
      .quota-cards { min-width: 0; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
      .quota-card { min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
      .quota-head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
      .quota-head strong { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; }
      .quota-head small { margin-left: auto; color: var(--faint); font-size: 8px; white-space: nowrap; }
      .quota-window { display: grid; grid-template-columns: 68px 42px minmax(0,1fr); gap: 6px; align-items: center; margin-top: 3px; font-size: 9px; }
      .quota-window label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .quota-window strong { color: var(--green); text-align: right; }
      .quota-window strong.warn { color: var(--yellow); }
      .quota-window strong.danger { color: var(--red); }
      .quota-window span { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .quota-unavailable { color: var(--yellow); font-size: 9px; }
      .content { height: 100%; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 312px minmax(0,1fr); }
      .list-pane { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: rgba(13,16,23,.68); }
      .list-head { padding: 18px 16px 12px; display: flex; align-items: center; gap: 8px; }
      .list-head h2 { margin: 0; font-size: 13px; letter-spacing: -.15px; }
      .count { color: var(--faint); font-size: 11px; }
      .list-head .grow { flex: 1; }
      .icon-btn, .primary, .secondary, .danger {
        border: 1px solid var(--line-bright); background: var(--panel-2); border-radius: 8px; cursor: pointer;
      }
      .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); }
      .icon-btn:hover, .secondary:hover { background: var(--panel-3); color: var(--text); }
      .primary { padding: 7px 12px; border-color: rgba(255,118,87,.45); background: linear-gradient(135deg,#e95d49,var(--brand)); color: white; font-weight: 700; }
      .secondary, .danger { padding: 7px 11px; }
      .danger { border-color: rgba(240,109,120,.32); color: #ff9ca5; background: rgba(240,109,120,.07); }
      .runlist { min-height: 0; overflow-y: auto; padding: 0 10px 16px; }
      .run-card {
        width: 100%; display: block; border: 1px solid transparent; background: transparent; border-radius: 11px;
        padding: 12px; margin-bottom: 5px; text-align: left; cursor: pointer;
      }
      .run-card:hover { background: rgba(255,255,255,.025); border-color: rgba(255,255,255,.03); }
      .run-card.selected { background: var(--panel-2); border-color: var(--line-bright); box-shadow: 0 8px 24px rgba(0,0,0,.14); }
      .run-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
      .run-title strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .run-title .dot { width: 7px; height: 7px; }
      .run-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; color: var(--faint); font-size: 10px; }
      .run-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .role-mini { display: flex; align-items: center; gap: 4px; color: var(--muted); }
      .role-mini .dot { width: 5px; height: 5px; box-shadow: none; }
      .detail { width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: hidden; }
      .empty {
        height: 100%; display: grid; place-items: center; padding: 36px; color: var(--muted); text-align: center;
      }
      .empty-card { max-width: 460px; }
      .empty-icon { width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 17px; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); color: var(--brand); font: 700 18px ui-monospace,monospace; }
      .empty h2 { color: var(--text); font-size: 18px; margin: 0 0 8px; }
      .empty p { margin: 0; }
      .run-view { height: 100%; min-height: 0; display: flex; flex-direction: column; }
      .hero { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg,rgba(23,28,39,.72),rgba(17,21,30,.45)); }
      .hero-top { display: flex; align-items: flex-start; gap: 16px; }
      .hero-copy { min-width: 0; }
      .eyebrow { color: var(--brand-2); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 5px; }
      .hero h2 { margin: 0; font-size: 20px; letter-spacing: -.45px; overflow-wrap: anywhere; }
      .path { color: var(--muted); font: 11px/1.45 ui-monospace,monospace; margin-top: 6px; overflow-wrap: anywhere; }
      .hero-actions { margin-left: auto; display: flex; gap: 8px; flex: 0 0 auto; }
      .stats { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; }
      .stat { min-width: 78px; }
      .stat label { display: block; color: var(--faint); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
      .stat strong { display: block; font-size: 13px; margin-top: 2px; }
      .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 8px; background: var(--panel-3); border: 1px solid var(--line-bright); color: var(--muted); font-size: 10px; font-weight: 700; text-transform: capitalize; }
      .badge.running, .badge.working { color: var(--cyan); border-color: rgba(90,214,232,.22); background: rgba(90,214,232,.07); }
      .badge.planning { color: var(--violet); border-color: rgba(167,139,250,.25); background: rgba(167,139,250,.07); }
      .badge.paused, .badge.waiting { color: var(--yellow); border-color: rgba(244,191,88,.25); background: rgba(244,191,88,.07); }
      .badge.terminated, .badge.done, .badge.idle, .badge.consensus, .badge.accepted { color: var(--green); border-color: rgba(74,210,149,.22); background: rgba(74,210,149,.06); }
      .badge.crashed, .badge.error, .badge.rejected { color: var(--red); border-color: rgba(240,109,120,.24); background: rgba(240,109,120,.07); }
      .team-flow { display: grid; grid-template-columns: minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr); gap: 0; padding: 18px 24px; border-bottom: 1px solid var(--line); }
      .connector { display: grid; place-items: center; color: var(--faint); }
      .role-card { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 13px 14px; }
      .role-card.working { border-color: rgba(90,214,232,.45); box-shadow: 0 0 0 1px rgba(90,214,232,.08), 0 12px 30px rgba(0,0,0,.18); }
      .role-head { display: flex; align-items: center; gap: 8px; }
      .role-name { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
      .role-status { margin-left: auto; color: var(--muted); font-size: 10px; text-transform: capitalize; }
      .model { margin-top: 8px; color: var(--text); font: 11px ui-monospace,monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .engine { margin-top: 3px; color: var(--faint); font-size: 10px; }
      .role-detail { margin-top: 8px; color: var(--muted); font-size: 10px; min-height: 15px; }
      .work-grid { flex: 1; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 1.18fr 1fr 1fr; gap: 1px; background: var(--line); }
      .agent-pane { min-width: 0; min-height: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; background: var(--panel); }
      .pane-head { padding: 12px 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
      .pane-head .count { margin-left: auto; }
      .log { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }
      .entry { padding: 0 0 14px; margin: 0 0 14px; border-bottom: 1px solid rgba(255,255,255,.045); }
      .entry:last-child { border-bottom: 0; }
      .entry.live-entry { padding: 10px; border: 1px solid rgba(90,214,232,.2); border-radius: 9px; background: rgba(90,214,232,.045); }
      .entry.live-entry .entry-head strong { color: var(--cyan); }
      .live-cursor { display: inline-block; width: 6px; height: 12px; margin-left: 3px; vertical-align: -2px; background: var(--cyan); animation: pulse 1s steps(1) infinite; }
      .entry-head { display: flex; gap: 8px; color: var(--faint); font-size: 9px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .07em; }
      .entry-head strong { color: var(--muted); }
      .entry-body { white-space: pre-wrap; overflow-wrap: anywhere; color: #cbd2de; font: 11px/1.62 ui-monospace,SFMono-Regular,Consolas,monospace; }
      .planner .entry-body { font-family: inherit; font-size: 12px; color: #dce1e9; }
      .composer { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding: 11px; border-top: 1px solid var(--line); background: var(--rail); }
      .composer textarea, .composer input { width: 100%; min-width: 0; color: var(--text); background: var(--bg); border: 1px solid var(--line-bright); border-radius: 8px; padding: 9px 10px; resize: none; outline: none; }
      .composer textarea:focus, .composer input:focus { border-color: rgba(90,214,232,.55); }
      .composer button { min-width: 62px; }
      .push-strip { padding: 8px 16px; border-top: 1px solid var(--line); background: var(--rail); color: var(--muted); font-size: 10px; white-space: nowrap; overflow-x: auto; }
      .push-strip span + span:before { content: " · "; color: var(--faint); }
      .session-body { padding: 22px 24px; display: grid; grid-template-columns: minmax(0,1fr) 280px; gap: 18px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
      .card-head { padding: 13px 15px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
      .history { max-height: calc(100vh - 300px); overflow-y: auto; padding: 15px; }
      .info-list { padding: 12px 15px; }
      .info-row { display: grid; grid-template-columns: 82px minmax(0,1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 11px; }
      .info-row:last-child { border-bottom: 0; }
      .info-row label { color: var(--faint); }
      .info-row span { color: #cbd2de; overflow-wrap: anywhere; }
      .model-grid { padding: 22px 24px; display: grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap: 12px; }
      .model-card { padding: 15px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; }
      .model-card strong { display: block; font: 12px ui-monospace,monospace; overflow-wrap: anywhere; }
      .model-card small { display: block; color: var(--muted); margin-top: 7px; text-transform: capitalize; }
      .json { padding: 18px; margin: 22px 24px; white-space: pre-wrap; overflow-wrap: anywhere; color: #cbd2de; font: 11px/1.6 ui-monospace,monospace; }
      dialog { width: min(620px,calc(100vw - 32px)); max-height: calc(100vh - 50px); color: var(--text); background: var(--panel); border: 1px solid var(--line-bright); border-radius: 14px; padding: 0; box-shadow: 0 30px 100px rgba(0,0,0,.65); }
      dialog::backdrop { background: rgba(0,0,0,.65); backdrop-filter: blur(4px); }
      .modal-head { padding: 16px 18px; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
      .modal-head h2 { margin: 0; font-size: 15px; }
      .modal-head button { margin-left: auto; }
      .form { padding: 18px; display: grid; gap: 13px; overflow-y: auto; }
      .form label { display: grid; gap: 5px; color: var(--muted); font-size: 11px; }
      .form input, .form textarea, .form select { width: 100%; color: var(--text); background: var(--bg); border: 1px solid var(--line-bright); border-radius: 8px; padding: 8px 10px; outline: none; }
      .form-row { display: grid; grid-template-columns: 130px minmax(0,1fr); gap: 10px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }
      .toast { position: fixed; right: 22px; bottom: 22px; max-width: 420px; padding: 11px 14px; border: 1px solid var(--line-bright); background: var(--panel-3); border-radius: 10px; box-shadow: var(--shadow); color: var(--text); font-size: 12px; z-index: 20; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .18s ease; }
      .toast.show { opacity: 1; transform: none; }
      @media (max-width: 1100px) {
        .app { grid-template-columns: 72px minmax(0,1fr); }
        .brand-copy, .tab .label, .nav-label, .rail-foot .connection span { display: none; }
        .brand { justify-content: center; padding-inline: 0; }
        .tab { justify-content: center; padding: 10px 0; }
        .team-flow { grid-template-columns: 1fr 16px 1fr 16px 1fr; padding-inline: 16px; }
        .work-grid { grid-template-columns: 1fr; }
        .agent-pane { min-height: 390px; }
      }
      @media (max-width: 760px) {
        body { overflow: auto; }
        .app { display: block; height: auto; min-height: 100vh; }
        .rail { height: 62px; position: sticky; top: 0; z-index: 8; flex-direction: row; align-items: center; padding: 8px; overflow-x: auto; }
        .brand { padding: 0 8px 0 0; }
        .brandmark { width: 34px; height: 34px; }
        .tab { width: auto; min-width: 44px; }
        .rail-foot { display: none; }
        .shell { height: auto; overflow: visible; display: block; }
        .header { height: 58px; padding-inline: 15px; }
        .header .sub { display: none; }
        .usage-dock { grid-template-columns: 1fr; }
        .usage-label { flex-direction: row; align-items: center; justify-content: space-between; }
        .quota-cards { overflow-x: auto; grid-template-columns: repeat(3,minmax(250px,1fr)); }
        .content { height: auto; overflow: visible; display: block; }
        .list-pane { max-height: 270px; border-right: 0; border-bottom: 1px solid var(--line); }
        .detail { height: auto; overflow: visible; }
        .run-view { height: auto; }
        .work-grid { overflow: visible; }
        .team-flow { grid-template-columns: 1fr; gap: 8px; }
        .connector { transform: rotate(90deg); height: 16px; }
        .hero-top { display: block; }
        .hero-actions { margin: 14px 0 0; }
        .session-body { grid-template-columns: 1fr; padding-inline: 14px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">
          <div class="brandmark">C</div>
          <div class="brand-copy"><strong>Claw</strong><small>Operator console</small></div>
        </div>
        <div class="nav-label">Workspace</div>
        <button class="tab" data-tab="autoloop" aria-selected="true"><span class="ico">↻</span><span class="label">Autoloops</span></button>
        <button class="tab" data-tab="sessions" aria-selected="false"><span class="ico">&gt;_</span><span class="label">Sessions</span></button>
        <button class="tab" data-tab="council" aria-selected="false"><span class="ico">◇</span><span class="label">Councils</span></button>
        <button class="tab" data-tab="forge" aria-selected="false"><span class="ico">⌁</span><span class="label">Forge</span></button>
        <div class="nav-label">System</div>
        <button class="tab" data-tab="models" aria-selected="false"><span class="ico">M</span><span class="label">Models</span></button>
        <div class="rail-foot"><div class="connection"><i id="railDot" class="dot online"></i><span id="railStatus">Control plane online</span></div></div>
      </aside>
      <section class="shell">
        <header class="header">
          <div><h1 id="pageTitle">Autoloops</h1><div class="sub" id="pageSub">Coordinate planner, coder, and reviewer roles</div></div>
          <div class="grow"></div>
          <div class="health-pill"><i id="healthDot" class="dot online"></i><span id="healthText">Connected</span></div>
        </header>
        <section class="usage-dock" aria-label="Account subscription limits">
          <div class="usage-label"><strong>Account limits</strong><span id="usageUpdated">Loading authoritative usage…</span><button id="usageRefresh" type="button">Refresh now</button></div>
          <div class="quota-cards" id="quotaCards"><div class="quota-card"><div class="quota-unavailable">Querying Codex, Claude, and Gemini…</div></div></div>
        </section>
        <div class="content">
          <aside class="list-pane">
            <div class="list-head"><h2 id="listTitle">Runs</h2><span class="count" id="listCount">0</span><span class="grow"></span><button class="icon-btn" id="refreshBtn" title="Refresh">↻</button><button class="primary" id="newBtn">+ New</button></div>
            <div class="runlist" id="runlist"></div>
          </aside>
          <main class="detail" id="detail"></main>
        </div>
      </section>
    </div>
    <dialog id="newDialog"><div id="dialogBody"></div></dialog>
    <div class="toast" id="toast"></div>
    <script>
      var app = {
        tab: "autoloop", items: [], selected: null, stream: null,
        auto: { state: null, planner: [], coder: [], reviewer: [], pushes: [], streams: {planner:"",coder:"",reviewer:""} },
        session: { info: null, history: [] }
      };
      var titles = {
        autoloop: ["Autoloops","Coordinate planner, coder, and reviewer roles","Runs"],
        sessions: ["Sessions","Inspect every live model session","Live sessions"],
        council: ["Councils","Multi-agent consensus work","Councils"],
        forge: ["Forge","Interview-driven application runs","Apps"],
        models: ["Models","Available model registry","Models"]
      };
      function el(id) { return document.getElementById(id); }
      function esc(value) { return String(value == null ? "" : value).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

      async function stopSession(){if(!confirm("Stop session "+app.selected+"? This ends its live process."))return;try{await post("/session/stop",{name:app.selected});toast("Session stopped");app.selected=null;renderEmpty();refresh();}catch(e){toast(e.message);}}
      async function openCouncil(id){try{var j=await api("/council/"+encodeURIComponent(id)+"/state");el("detail").innerHTML='<div class="hero"><div class="eyebrow">Council</div><h2>'+esc(id)+'</h2><div class="path">'+esc((j.session||{}).task||"")+'</div></div><pre class="card json">'+esc(JSON.stringify(j.session,null,2))+'</pre>';}catch(e){toast(e.message);}}
      async function openForge(id){try{var j=await post("/ultraapp/"+encodeURIComponent(id),{});el("detail").innerHTML='<div class="hero"><div class="eyebrow">Forge app</div><h2>'+esc(id)+'</h2><div class="path">'+esc(((j.state||{}).mode)||"")+'</div></div><pre class="card json">'+esc(JSON.stringify({state:j.state,spec:j.spec},null,2))+'</pre>';}catch(e){toast(e.message);}}
      function openModel(id){var m=app.items.find(function(x){return x.id===id;});el("detail").innerHTML='<div class="hero"><div class="eyebrow">Model registry</div><h2>'+esc(id)+'</h2><div class="path">Provider: '+esc((m||{}).owned_by||"unknown")+'</div></div><div class="model-grid">'+app.items.filter(function(x){return x.owned_by===(m||{}).owned_by;}).map(function(x){return '<div class="model-card"><strong>'+esc(x.id)+'</strong><small>'+esc(x.owned_by)+'</small></div>';}).join("")+'</div>';}
      function formField(label,name,placeholder,required,type){return '<label>'+esc(label)+'<input name="'+esc(name)+'" type="'+esc(type||"text")+'" placeholder="'+esc(placeholder||"")+'" '+(required?"required":"")+' /></label>';}
      function roleFields(role,engine,model){return '<div class="form-row"><label>'+role+' engine<select name="'+role+'_engine"><option value="'+engine+'">'+engine+'</option><option value="claude">claude</option><option value="agy">agy</option><option value="codex">codex</option><option value="gemini">gemini</option></select></label>'+formField(role+" model",role+"_model",model,false)+'</div>';}
      async function openNew() {
        if(app.tab==="forge"){try{var j=await post("/ultraapp/new",{});await refresh();openItem(j.runId);}catch(e){toast(e.message);}return;}
        var body='<div class="modal-head"><h2>New '+esc(titles[app.tab][0].slice(0,-1))+'</h2><button class="icon-btn" type="button" id="closeDialog">×</button></div><form class="form" id="newForm">';
        if(app.tab==="autoloop")body+=formField("Run ID (optional)","run_id","release-audit",false)+formField("Workspace","workspace","C:\\Dev\\YourRepo",true)+roleFields("planner","claude","claude-opus-5")+roleFields("coder","agy","gemini-3.7-flash-medium")+roleFields("reviewer","codex","gpt-5.6-sol");
        else if(app.tab==="sessions")body+=formField("Session name","name","research-session",true)+formField("Working directory","cwd","C:\\Dev\\YourRepo",true)+roleFields("","claude","claude-opus-5").replaceAll("_engine","engine").replaceAll("_model","model").replace("> engine",">Engine").replace("> model",">Model");
        else body+='<label>Task<textarea name="task" rows="4" required></textarea></label>'+formField("Project directory","projectDir","C:\\Dev\\YourRepo",true)+formField("Max rounds","maxRounds","15",false,"number");
        body+='<div class="modal-actions"><button type="button" class="secondary" id="cancelDialog">Cancel</button><button class="primary" type="submit">Start</button></div></form>';
        el("dialogBody").innerHTML=body;var dialog=el("newDialog");dialog.showModal();el("closeDialog").onclick=function(){dialog.close();};el("cancelDialog").onclick=function(){dialog.close();};el("newForm").onsubmit=submitNew;
      }
      async function submitNew(e){e.preventDefault();var form=new FormData(e.target),body={};form.forEach(function(v,k){if(String(v).trim())body[k]=String(v).trim();});if(body.maxRounds)body.maxRounds=Number(body.maxRounds);var url=app.tab==="autoloop"?"/autoloop/new":app.tab==="sessions"?"/session/start":"/council/new";try{var j=await post(url,body);el("newDialog").close();await refresh();openItem(j.run_id||j.name||j.id);}catch(err){toast(err.message);}}
      setInterval(refresh,2500);
      setInterval(function(){refreshUsage(false);},60_000);
      setInterval(function(){if(app.tab==="autoloop"&&app.auto.state)paintAutoState();if(app.tab==="sessions"&&app.session.info)paintSessionInfo();},1000);
      renderEmpty();refresh();refreshUsage(false);
    </script>
  </body>
</html>
